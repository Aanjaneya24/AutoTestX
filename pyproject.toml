[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotestx"
version = "0.1.0"
description = "Configuration-driven RTL regression automation with Perl log parsing and an ML log-classification experiment"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6", "scikit-learn>=1.2", "joblib>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
autotestx = "autotestx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
